name: SEO notify

# Posts routine output to Slack, so the cloud routines themselves need no Slack secrets:
#  - status/report-latest.md changed  -> the daily report as one message
#  - a new SKIPPED / failed line in status/<date>.txt -> a warning

on:
  push:
    branches: [main]
    paths: ['status/**']

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ vars.SLACK_DISABLED != 'true' }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daily report
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^status/report-latest.md$'; then
            level=ok; grep -qiE 'SKIPPED|failed|error' status/report-latest.md && level=warn
            node scripts/notify.mjs "Daily report" "$(cat status/report-latest.md)" "$level" || true
          fi
      - name: Skips and failures
        run: |
          new=$(git diff --unified=0 HEAD~1 HEAD -- 'status/*.txt' | grep -E '^\+[^+]' | grep -iE 'SKIPPED|failed' | sed 's/^+//' || true)
          if [ -n "$new" ]; then node scripts/notify.mjs "Routine skipped or failed" "$new" warn || true; fi
