name: Blog

# Three ways in:
#  - a push that touches website/blog/posts/**  -> rebuild (drafts land under blog/preview/) and, for new drafts, notify Slack
#  - repository_dispatch approve-post {slug}    -> flip draft: false, stamp the date, rebuild, commit   (sent by the Slack worker)
#  - repository_dispatch reject-post  {slug}    -> retire the draft (renamed to .md.rejected), rebuild, commit
#  - repository_dispatch revise-post  {slug, notes, by} -> save the change request to blog-reviews/<slug>/requests/, commit
#                                                  (the rewrite routine picks it up, rewrites, pushes with "[rewrite]" in the message)
#  - a push whose message contains [rewrite]     -> rebuild and re-notify Slack for the rewritten draft(s)
#  - workflow_dispatch notify {slug}             -> (re)send the Slack message for a draft, e.g. to test the buttons
#  - workflow_dispatch                          -> the same two actions by hand from the Actions tab

on:
  push:
    branches: [main]
    paths: ['website/blog/posts/**', 'website/blog/img/**', 'website/blog/config.json', 'website/blog/blog.css', 'website/scripts/build-blog.mjs']
  repository_dispatch:
    types: [approve-post, reject-post, revise-post]
  workflow_dispatch:
    inputs:
      action:
        description: approve, reject or notify (re-send the Slack message)
        required: true
        default: approve
        type: choice
        options: [approve, reject, notify]
      slug:
        description: post slug (file name without .md)
        required: true

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "action=${{ github.event.action == 'approve-post' && 'approve' || github.event.action == 'revise-post' && 'revise' || 'reject' }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ github.event.client_payload.slug }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve
        if: steps.act.outputs.action == 'approve'
        run: |
          f="website/blog/posts/${{ steps.act.outputs.slug }}.md"
          test -f "$f" || { echo "no such draft: $f"; exit 1; }
          # Snapshot the writer's original draft next to the approved version, so the writer can
          # learn from Moritz's edits (see blog-reviews/README.md). Original = the commit that added the file.
          slug="${{ steps.act.outputs.slug }}"
          added=$(git log --diff-filter=A --format=%H -- "$f" | tail -1)
          if [ -n "$added" ]; then
            d="blog-reviews/$slug"; mkdir -p "$d"
            git show "$added:$f" > "$d/original.md"
            cp "$f" "$d/final.md"
            git diff --no-index --no-color "$d/original.md" "$d/final.md" > "$d/changes.diff" || true
            edits=$(git log --format='%an' "$added"..HEAD -- "$f" | sort -u | tr '\n' ',' | sed 's/,$//')
            printf '{"slug":"%s","draftCommit":"%s","approved":"%s","editedBy":"%s","learned":false}\n' \
              "$slug" "$added" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$edits" > "$d/status.json"
            if cmp -s "$d/original.md" "$d/final.md"; then echo "approved unchanged"; else echo "approved with edits, review saved to $d"; fi
          fi
          today=$(date -u +%Y-%m-%d)
          # draft: true -> false; add a date if the draft has none
          if grep -qE '^draft:' "$f"; then sed -i -E 's/^draft:.*/draft: false/' "$f"; else sed -i '2i draft: false' "$f"; fi
          grep -qE '^date:' "$f" || sed -i "2i date: $today" "$f"
          echo "published $f"

      - name: Reject
        if: steps.act.outputs.action == 'reject'
        run: |
          f="website/blog/posts/${{ steps.act.outputs.slug }}.md"
          test -f "$f" || { echo "no such draft: $f"; exit 1; }
          git mv "$f" "$f.rejected"
          echo "retired $f"

      - name: Save change request
        if: steps.act.outputs.action == 'revise'
        env:
          NOTES: ${{ github.event.client_payload.notes }}
          BY: ${{ github.event.client_payload.by }}
        run: |
          slug="${{ steps.act.outputs.slug }}"
          test -f "website/blog/posts/$slug.md" || { echo "no such draft: $slug"; exit 1; }
          d="blog-reviews/$slug/requests"; mkdir -p "$d"
          f="$d/$(date -u +%Y%m%dT%H%M%SZ).md"
          { printf -- '---\nslug: %s\nby: %s\nrequested: %s\nstatus: open\n---\n\n' "$slug" "$BY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; printf '%s\n' "$NOTES"; } > "$f"
          echo "saved $f"

      - name: Build
        run: node website/scripts/build-blog.mjs

      - name: Commit
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A website/blog blog-reviews
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          case "${{ steps.act.outputs.action }}" in
            approve) msg="Publish blog post: ${{ steps.act.outputs.slug }}";;
            reject)  msg="Retire blog draft: ${{ steps.act.outputs.slug }}";;
            revise)  msg="Change request for blog draft: ${{ steps.act.outputs.slug }}";;
            *)       msg="Rebuild blog";;
          esac
          git commit -m "$msg"
          # Another push (the writer, the routine, Moritz) may land at the same time: rebase and retry.
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase -X theirs origin main || { git rebase --abort; sleep 3; git pull --rebase -X theirs origin main; }
            sleep $((i * 3))
          done

      # New drafts pushed by the writing routine get announced once, with a preview link and buttons.
      # Rewrites (commit message contains [rewrite]) are announced again for the modified drafts.
      - name: Notify Slack about new or rewritten drafts
        if: steps.act.outputs.action == 'build' && env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          before="${{ github.event.before }}"
          git rev-parse -q --verify "$before^{commit}" >/dev/null 2>&1 || before="HEAD~1"
          for f in $(git diff --name-only --diff-filter=A "$before" HEAD -- 'website/blog/posts/*.md' 2>/dev/null); do
            slug=$(basename "$f" .md)
            node website/scripts/notify-slack.mjs "$slug" || echo "slack notification failed for $slug"
          done
          case "$HEAD_MSG" in *"[rewrite]"*)
            for f in $(git diff --name-only --diff-filter=M "$before" HEAD -- 'website/blog/posts/*.md' 2>/dev/null); do
              slug=$(basename "$f" .md)
              grep -qE '^draft:\s*true' "$f" && { node website/scripts/notify-slack.mjs "$slug" --rewrite || echo "slack notification failed for $slug"; }
            done;;
          esac

      - name: Notify Slack on request
        if: steps.act.outputs.action == 'notify' && env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: node website/scripts/notify-slack.mjs "${{ steps.act.outputs.slug }}"

      # Deploy the whole website/ folder to Cloudflare Pages so previews and published posts are reachable.
      # Needs the repo secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy website --project-name transcriber --branch main --commit-dirty=true
